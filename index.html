<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>빼빼로 댄스</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#8f1420;}
  body{transition:background 1s;
    font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#fff3dc;
    background:radial-gradient(ellipse at 50% 38%,#f0535c 0%,#d42f3a 38%,#8f1420 100%);
    -webkit-user-select:none;user-select:none;
  }
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  .hud{position:fixed;left:0;right:0;text-align:center;pointer-events:none}
  .top{top:max(18px,3vh)}
  .date{font-size:clamp(15px,2.4vw,22px);letter-spacing:.35em;text-indent:.35em;opacity:.85}
  h1{
    margin:.1em 0 0;font-weight:400;font-size:clamp(30px,6.5vw,64px);line-height:1.05;
    text-shadow:0 4px 0 #6d0e18,0 10px 24px rgba(60,0,10,.45);
    transform:scale(var(--pulse,1));transform-origin:50% 60%;
  }
  .bottom{bottom:max(18px,3vh);display:flex;flex-direction:column;align-items:center;gap:10px}
  button{
    pointer-events:auto;font:inherit;font-size:16px;color:#6d0e18;background:#fff3dc;border:0;
    border-radius:999px;padding:9px 18px;cursor:pointer;box-shadow:0 5px 0 #6d0e18;
  }
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #6d0e18}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .hint{font-size:14px;opacity:.75;max-width:92vw;line-height:1.45}
  .hint:empty{display:none}
  body.power{background:radial-gradient(ellipse at 50% 38%,#ffc45a 0%,#ff6a3d 40%,#a3154b 100%)}
  body.idol{background:radial-gradient(ellipse at 50% 35%,#7a3fb0 0%,#2b1458 42%,#0a0618 100%)}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  #editor,#sharebox,#busy{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;
    background:rgba(60,5,12,.72);z-index:5}
  #editor.on,#sharebox.on,#busy.on{display:flex}
  #sharebox,#busy{display:none}
  #busy{font-size:22px;color:#fff3dc}
  #link{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:10px 12px;border-radius:12px;
    border:2px solid #6d0e18;background:#fff;color:#6d0e18;margin:0 0 14px}
  [hidden]{display:none!important}
  .panel{background:#fff3dc;color:#6d0e18;border-radius:22px;padding:18px 18px 22px;text-align:center;
    width:min(372px,100%);max-height:100%;overflow:auto;box-sizing:border-box}
  .panel h2{margin:0 0 10px;font-weight:400;font-size:22px}
  #ed{width:100%;max-width:336px;height:auto;border-radius:14px;touch-action:none;cursor:grab;background:#2a1a12;position:static}
  #zoom{width:100%;max-width:336px;margin:12px 0 4px;accent-color:#d42f3a}
  .note{font-size:13px;line-height:1.5;margin:4px 0 14px;opacity:.8}
  .panel button{background:#d42f3a;color:#fff3dc}
  .panel button.ghost{background:transparent;color:#6d0e18;box-shadow:inset 0 0 0 2px #6d0e18}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:18px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud top">
  <div class="date">11.11</div>
  <h1 id="title">HAPPY 빼빼로 DAY</h1>
</div>
<div class="hud bottom">
  <div class="row">
    <button id="pick" type="button">사진 올리기</button>
    <button id="pickSong" type="button">노래 넣기</button>
    <button id="share" type="button" hidden>공유 링크 만들기</button>
    <button id="music" type="button">♪ 음악 켜기</button>
  </div>
  <input id="file" type="file" accept="image/*" hidden>
  <input id="sfile" type="file" accept="audio/*,.wav,.mp3,.m4a,.ogg,.flac" hidden>
  <div class="hint"></div>
</div>
<div id="editor" role="dialog" aria-modal="true" aria-labelledby="edh">
  <div class="panel">
    <h2 id="edh">얼굴을 자동으로 못 찾았어요<br>타원에 꽉 맞춰 주세요</h2>
    <canvas id="ed" width="336" height="418"></canvas>
    <input id="zoom" type="range" min="0" max="100" value="0" aria-label="사진 확대">
    <p class="note">사진을 드래그해 위치를, 슬라이더나 휠·두 손가락으로 크기를 맞춰요.<br>사진은 어디에도 전송되지 않고 이 브라우저 안에서만 쓰여요.</p>
    <div class="row">
      <button id="cancel" class="ghost" type="button">취소</button>
      <button id="ok" type="button">춤추게 하기</button>
    </div>
  </div>
</div>
<div id="busy" role="status">얼굴 찾는 중…</div>
<div id="sharebox" role="dialog" aria-modal="true" aria-labelledby="shh">
  <div class="panel">
    <h2 id="shh">내 빼빼로 댄스 공유</h2>
    <p class="note" id="shnote">링크를 만들면 얼굴 사진이 11월 11일 24시까지 서버에 저장되고,<br>그 이후에는 삭제돼요. 그동안 링크를 아는 사람은 누구나 볼 수 있어요.</p>
    <input id="link" type="text" readonly hidden aria-label="공유 링크">
    <div class="row">
      <button id="shclose" class="ghost" type="button">닫기</button>
      <button id="shgo" type="button">링크 만들기</button>
      <button id="shshare" type="button" hidden>공유하기</button>
    </div>
  </div>
</div>
<div id="err">3D 화면을 불러오지 못했어요. 다른 브라우저에서 다시 열어 주세요.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const FACE="";
const FACE3D=null;
const DEFAULT_SONG="song.mp3";   // the page's own song: a file next to this page, or a data: URI
// Supabase: project URL + publishable(anon) key, and a public storage bucket for shared faces.
const SB_URL="https://iplduhidlesygllpdpme.supabase.co",SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwbGR1aGlkbGVzeWdsbHBkcG1lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1Njc1ODYsImV4cCI6MjEwMTE0MzU4Nn0.FXcLfQw6YVztouAOxIEbFUmobPkWBflL9PsQo84Hczs",SB_BUCKET="faces";
const SYN_BPM=126, TAU=Math.PI*2;
const canvas=document.getElementById('c');
let renderer;
try{
  if(!window.THREE) throw new Error('no three');
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
}catch(e){document.getElementById('err').style.display='flex';return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,0.1,100);

scene.add(new THREE.HemisphereLight(0xfff1e0,0x7a2a22,0.8));
const sun=new THREE.DirectionalLight(0xffffff,0.8);
sun.position.set(4,11,7);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-8,right:8,top:9,bottom:-3,near:1,far:30});
sun.shadow.bias=-0.0005;
scene.add(sun);

// ---------- stage ----------
const floor=new THREE.Mesh(new THREE.CircleGeometry(7.5,72),
  new THREE.MeshStandardMaterial({color:0xd9434c,roughness:.7}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const ring=new THREE.Mesh(new THREE.RingGeometry(3.3,3.45,72),
  new THREE.MeshBasicMaterial({color:0xfff3dc,transparent:true,opacity:.55}));
ring.rotation.x=-Math.PI/2;ring.position.y=.01;scene.add(ring);

const glowA=new THREE.PointLight(0xff4fd8,0,30),glowB=new THREE.PointLight(0x39c6ff,0,30);
scene.add(glowA);scene.add(glowB);
const hemi=scene.children.find(o=>o.isHemisphereLight);
let theme=-1;
function setTheme(lv){ // 0 calm, 1 medium, 2 wild
  if(lv===theme)return;theme=lv;
  document.body.classList.toggle('idol',lv===0);document.body.classList.toggle('power',lv===2);
  floor.material.color.setHex([0x3a2466,0xd9434c,0xff8f3a][lv]);
  ring.material.color.setHex(lv===0?0xff7fe0:0xfff3dc);
  hemi.intensity=lv===0?.5:.8;glowA.intensity=glowB.intensity=lv===0?1.1:0;
}

// ---------- face texture + head material ----------
const FW=420,FH=522;
const faceCv=document.createElement('canvas');faceCv.width=FW;faceCv.height=FH;
const fctx=faceCv.getContext('2d');
const faceTex=new THREE.CanvasTexture(faceCv);
faceTex.minFilter=THREE.LinearFilter;faceTex.generateMipmaps=false;
const headU={ex:{value:new THREE.Vector4(0,0,0,0)},brow:{value:0},map:{value:faceTex},hair:{value:new THREE.Color(0x2a1a12)},skin:{value:new THREE.Color(0xf2c9a5)}};
function avg(x0,y0,x1,y1){
  const d=fctx.getImageData(x0*FW|0,y0*FH|0,Math.max(1,(x1-x0)*FW|0),Math.max(1,(y1-y0)*FH|0)).data;
  let r=0,g=0,b=0;const n=d.length/4;
  for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];}
  return [r/n/255,g/n/255,b/n/255];
}
function commitFace(){ // side/back of the head take their colours from the picture
  try{const h=avg(.4,.03,.6,.08),s=avg(.28,.6,.4,.68);
    headU.hair.value.setRGB(h[0],h[1],h[2]);headU.skin.value.setRGB(s[0],s[1],s[2]);}catch(e){}
  faceTex.needsUpdate=true;
}
(function drawDefaultFace(){
  const c=fctx;c.fillStyle='#f2c9a5';c.fillRect(0,0,FW,FH);
  c.fillStyle='#2a1a12';c.beginPath();c.moveTo(0,0);c.lineTo(FW,0);c.lineTo(FW,250);
  c.quadraticCurveTo(360,120,210,130);c.quadraticCurveTo(60,120,0,250);c.closePath();c.fill();
  c.beginPath();c.arc(140,290,17,0,7);c.arc(280,290,17,0,7);c.fill();
  c.fillStyle='#f4a9a0';c.beginPath();c.arc(95,345,26,0,7);c.arc(325,345,26,0,7);c.fill();
  c.strokeStyle='#2a1a12';c.lineWidth=11;c.lineCap='round';c.beginPath();c.arc(210,345,62,.2*Math.PI,.8*Math.PI);c.stroke();
  commitFace();
})();
const sharedId=(function(){try{const d=new URLSearchParams(location.search).get('d');
  return d&&/^[a-z0-9]{6,20}$/.test(d)?d:null;}catch(e){return null;}})();
const shared3=(function(){try{return new URLSearchParams(location.search).get('f')==='3';}catch(e){return false;}})();
if(sharedId&&SB_URL&&!shared3){const im=new Image();im.crossOrigin='anonymous';
  im.onload=function(){fctx.drawImage(im,0,0,FW,FH);commitFace();};
  im.src=SB_URL+'/storage/v1/object/public/'+SB_BUCKET+'/'+sharedId+'.jpg';}
else if(FACE){const im=new Image();im.onload=function(){fctx.drawImage(im,0,0,FW,FH);commitFace();};im.src=FACE;}
function headMaterial(){
  return new THREE.ShaderMaterial({
    uniforms:headU,
    vertexShader:`
      varying vec3 vP; varying vec3 vN;
      void main(){ vP=position; vN=normalMatrix*normal;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      uniform sampler2D map; uniform vec3 hair; uniform vec3 skin;
      uniform vec4 ex; uniform float brow; // ex = smile, blink(one eye), blink(other eye), mouth open
      varying vec3 vP; varying vec3 vN;
      float g(vec2 d,vec2 s){return exp(-0.5*(d.x*d.x/(s.x*s.x)+d.y*d.y/(s.y*s.y)));}
      void main(){
        vec2 uv=vP.xy*0.5+0.5, o=vec2(0.0);
        vec2 dl=uv-vec2(0.33,0.485), dr=uv-vec2(0.67,0.485), dm=uv-vec2(0.5,0.21);
        o.y+=dl.y*1.8*ex.y*g(dl,vec2(0.11,0.045));
        o.y+=dr.y*1.8*ex.z*g(dr,vec2(0.11,0.045));
        float wm=g(dm,vec2(0.17,0.075));
        o.y-=ex.x*0.032*wm*(dm.x*dm.x/0.0144-0.35);
        o.x-=dm.x*0.16*ex.x*wm;
        o.y-=dm.y*0.42*ex.w*wm; o.x+=dm.x*0.22*ex.w*wm;
        float bw=(uv.y-0.6)/0.05;
        o.y-=brow*0.028*exp(-0.5*bw*bw)*smoothstep(0.08,0.2,uv.x)*smoothstep(0.92,0.8,uv.x);
        vec3 tex=texture2D(map,uv+o).rgb;
        float hl=mix(-0.45,0.2,smoothstep(-0.5,0.3,vP.z));
        vec3 side=mix(skin,hair,smoothstep(hl-0.06,hl+0.06,vP.y));
        vec3 col=mix(side,tex,smoothstep(0.12,0.4,vP.z));
        float d=0.74+0.26*max(dot(normalize(vN),normalize(vec3(0.3,0.6,0.7))),0.0);
        gl_FragColor=vec4(col*d*1.06,1.0);
      }`
  });
}

// ---------- pepero character ----------
const N=14, L=3.0, SL=L/N, R=0.17, LA=0.6, LL=0.45, HIP=2*LL+0.08;
const limbM=new THREE.MeshStandardMaterial({color:0x3a1c0e,roughness:.5});
const whiteM=new THREE.MeshStandardMaterial({color:0xfffaf0,roughness:.6});
const bisM=new THREE.MeshStandardMaterial({color:0xe2ae66,roughness:.85});
function mesh(geo,mat,parent,x,y,z){
  const m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);m.castShadow=true;parent.add(m);return m;
}
function makePepero(o){
  const g=new THREE.Group(), hips=new THREE.Group();g.add(hips);let egg=null;
  const coatM=new THREE.MeshStandardMaterial({color:o.coat,roughness:.32});
  const crumbM=new THREE.MeshStandardMaterial({color:o.crumb,roughness:.9});
  const crumbG=new THREE.IcosahedronGeometry(0.04,0);
  const segs=[];let parent=hips;
  for(let i=0;i<N;i++){
    const s=new THREE.Group();s.position.y=i?SL:0;parent.add(s);
    const bare=i<3, r=bare?R*0.8:R, m=bare?bisM:coatM;
    mesh(new THREE.CylinderGeometry(r,r,SL,24,1,true),m,s,0,SL/2,0);
    mesh(new THREE.SphereGeometry(r,24,14),m,s,0,0,0);
    if(!bare) for(let k=0;k<5;k++){
      const a=Math.random()*TAU;
      const c=mesh(crumbG,crumbM,s,Math.cos(a)*R,Math.random()*SL,Math.sin(a)*R);
      c.rotation.set(Math.random()*3,Math.random()*3,0);c.scale.setScalar(.7+Math.random()*.7);
    }
    segs.push(s);parent=s;
  }
  const head=new THREE.Group();head.position.y=SL;parent.add(head);
  mesh(new THREE.SphereGeometry(R,24,14),coatM,head,0,0,0);
  if(o.face){
    egg=mesh(new THREE.SphereGeometry(1,56,40),headMaterial(),head,0,0.63,0.02);
    egg.scale.set(0.58,0.72,0.6);
  }else{
    const eyeM=new THREE.MeshBasicMaterial({color:0x2a1408});
    const s=segs[N-2];
    mesh(new THREE.SphereGeometry(.035,12,10),eyeM,s,-.07,SL*.6,R*.93);
    mesh(new THREE.SphereGeometry(.035,12,10),eyeM,s,.07,SL*.6,R*.93);
    const sm=mesh(new THREE.TorusGeometry(.055,.013,8,16,Math.PI),eyeM,s,0,SL*.25,R*.97);
    sm.rotation.z=Math.PI;
  }
  const arms=[],legs=[];
  [1,-1].forEach(side=>{
    const sh=new THREE.Group();sh.position.set(side*R*.9,SL*.5,0);segs[N-4].add(sh);
    mesh(new THREE.CylinderGeometry(.045,.045,LA,10),limbM,sh,0,-LA/2,0);
    mesh(new THREE.SphereGeometry(.06,12,10),limbM,sh,0,0,0);
    const el=new THREE.Group();el.position.y=-LA;sh.add(el);
    mesh(new THREE.SphereGeometry(.05,12,10),limbM,el,0,0,0);
    mesh(new THREE.CylinderGeometry(.045,.045,LA,10),limbM,el,0,-LA/2,0);
    mesh(new THREE.SphereGeometry(.11,16,12),whiteM,el,0,-LA,0);
    arms.push({sh,el,side});
    const hip=new THREE.Group();hip.position.set(side*.08,.03,0);hip.rotation.order='YXZ';hip.rotation.y=side*.55;hips.add(hip);
    mesh(new THREE.CylinderGeometry(.045,.045,LL,10),limbM,hip,0,-LL/2,0);
    const kn=new THREE.Group();kn.position.y=-LL;hip.add(kn);
    mesh(new THREE.SphereGeometry(.05,12,10),limbM,kn,0,0,0);
    mesh(new THREE.CylinderGeometry(.045,.045,LL,10),limbM,kn,0,-LL/2,0);
    const ft=mesh(new THREE.SphereGeometry(1,16,12),whiteM,kn,0,-LL,.08);ft.scale.set(.12,.085,.2);
    legs.push({hip,kn,side});
  });
  return {g,hips,segs,head,arms,legs,egg};
}

// ---------- choreography ----------
const sin=Math.sin,cos=Math.cos,PI=Math.PI;
const base=()=>({squat:0,x:0,rotY:0,leanZ:0,leanX:0,waveA:0,wavePh:0,hx:0,hy:0,hz:0,
  aLz:.3,aLx:0,eL:.2,eLx:0,aRz:.3,aRx:0,eR:.2,eRx:0,waveX:0,spread:0,liftL:0,liftR:0});
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
const moves=[
  function disco(b){const p=base(),s=.5+.5*Math.tanh(4*sin(b*PI));
    p.squat=.07+.07*cos(b*TAU);p.leanZ=(.5-s)*.5;p.hz=(s-.5)*.35;p.rotY=(s-.5)*.5;
    p.aLz=.7+1.6*s;p.eL=1.3*(1-s)+.1;p.aRz=.7+1.6*(1-s);p.eR=1.3*s+.1;
    p.liftL=.1*Math.max(0,sin(b*PI));p.liftR=.1*Math.max(0,-sin(b*PI));return p;},
  function wave(b){const p=base();
    p.squat=.05+.04*cos(b*TAU);p.waveA=.17;p.wavePh=b*PI;p.hz=.22*sin(b*PI-2.2);
    p.aLz=1.5+.45*sin(b*PI);p.eL=.6*sin(b*PI-1);p.aRz=1.5-.45*sin(b*PI);p.eR=-.6*sin(b*PI+1);return p;},
  function twist(b){const p=base();
    p.rotY=.75*sin(b*PI);p.squat=.12+.06*cos(b*TAU);p.leanX=.18;p.hy=-.3*sin(b*PI);
    p.aLz=.55;p.aLx=.9+.35*sin(b*TAU);p.eL=1.5;p.aRz=.55;p.aRx=.9-.35*sin(b*TAU);p.eR=1.5;
    p.liftL=.22*Math.max(0,sin(b*PI));p.liftR=.22*Math.max(0,-sin(b*PI));return p;},
  function sidestep(b){const p=base(),s=sin(b*PI/2);
    p.x=.75*s;p.leanZ=-.4*cos(b*PI/2);p.squat=.06+.06*cos(b*TAU);p.hz=.25*cos(b*PI/2);
    p.aLz=1.85+.4*s;p.aRz=1.85-.4*s;p.eL=.3+.3*cos(b*TAU);p.eR=.3+.3*cos(b*TAU);
    p.liftL=.18*Math.max(0,sin(b*PI));p.liftR=.18*Math.max(0,-sin(b*PI));return p;},
  function finale(b){const p=base();
    if(b<4){p.rotY=TAU*ease(b/4);p.squat=.06+.05*cos(b*TAU);p.aLz=p.aRz=2.1;p.eL=p.eR=.15;}
    else{p.squat=-.3*Math.abs(sin(b*PI));p.aLz=p.aRz=2.15+.15*cos(b*TAU);p.eL=p.eR=.25+.25*cos(b*TAU);
      p.hz=.15*sin(b*PI);}
    return p;}
];
// --- idol set: poses hit on every beat and hold ---
// arm = [raise, forward, elbow bend, elbow forward bend]
function P(o){const p=base();const L=o.L||[.3,0,.2,0],R=o.R||[.3,0,.2,0];
  p.aLz=L[0];p.aLx=L[1];p.eL=L[2];p.eLx=L[3];p.aRz=R[0];p.aRx=R[1];p.eR=R[2];p.eRx=R[3];
  for(const k in o)if(k!=='L'&&k!=='R')p[k]=o[k];return p;}
function keyed(keys){return function(b){
  const n=keys.length,i=Math.floor(b)%n,f=b-Math.floor(b),a=keys[(i+n-1)%n],c=keys[i];
  const w=1-Math.pow(1-Math.min(1,f/.36),3),p={};
  for(const k in c)p[k]=a[k]+(c[k]-a[k])*w;
  p.squat+=.05*Math.exp(-f*6);return p;};}
const ONHIP=[.9,.15,-1.7,0],UP=[2.3,0,.1,0],T=[1.57,0,0,0],DOWN=[.25,0,.1,0];

const t0=performance.now();
let beat0=0,tRef=t0,nextN=0;

function tone(dest,f,t,dur,type,vol,cut){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.001,t+dur);

function step(n,t){ // n counts 16th notes
  const s=n%16,bar=Math.floor(n/16),sg=SONGS.fun,ci=bar%4,root=sg.roots[ci];
  if(s%4===0){ // four-on-the-floor kick, and it ducks the bass and chords so the beat pumps
    const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(165,t);
    o.frequency.exponentialRampToValueAtTime(45,t+.11);g.gain.setValueAtTime(1,t);
    g.gain.exponentialRampToValueAtTime(.001,t+.24);o.connect(g);g.connect(master);o.start(t);o.stop(t+.27);
    duck.gain.cancelScheduledValues(t);duck.gain.setValueAtTime(.3,t);duck.gain.linearRampToValueAtTime(1,t+.2);
  }
  if(s===4||s===12){hit(t,.17,.42,'bandpass',1800);hit(t+.012,.1,.25,'bandpass',2600);}
  hit(t,.03,s%2?.05:.1,'highpass',8000);

  if(bar%2===0&&s===0)hit(t,.9,.2,'highpass',5000);              // crash where the dance move changes
  if(bar%2===1&&s>=12)hit(t,.06,.14+.06*(s-12),'bandpass',2200);  // snare roll into the next move

    if(s%4===0)tone(duck,mf(root),t,.13,'sawtooth',.34,700);
    else if(s%4===2)tone(duck,mf(root+12),t,.17,'sawtooth',.3,900);
    else if(s===15)tone(duck,mf(root+7),t,.1,'sawtooth',.22,900);

    if(s%4===0&&bar%2===1)hit(t,.12,.2,'bandpass',1500); // extra claps on every beat to build

  if(sg.stab.indexOf(s)>=0)sg.chords[ci].forEach(m=>{tone(duck,mf(m),t,.15,'sawtooth',.05,2600);tone(duck,mf(m+12),t,.12,'sawtooth',.025,3200);});
  if(s%2===0){const m=sg.lead[ci][s/2];
    if(m){tone(master,mf(m),t,.22,sg.leadType,.05,5200);tone(master,mf(m)*1.007,t,.22,sg.leadType,.032,5200);}}
}
function sched(){
  const nb=beatNow();

    const at=ac.currentTime+(nextN/4-nb)*60/SYN_BPM;
    if(at>ac.currentTime)step(nextN,at);

// ---------- your own song: loaded from this device, analysed here, never uploaded ----------
function fftMag(re,im,N,cosT,sinT,rev){
  for(let i=0;i<N;i++){const j=rev[i];if(j>i){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t;}}
  for(let s=2;s<=N;s<<=1){const h=s>>1,st=N/s;
    for(let i=0;i<N;i+=s)for(let k=0;k<h;k++){const c=cosT[k*st],sn=sinT[k*st],a=i+k,b=a+h;
      const tr=re[b]*c+im[b]*sn,ti=im[b]*c-re[b]*sn;re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti;}}
}
function analyzeSong(buf){
  const sr=buf.sampleRate,Lc=buf.getChannelData(0),Rc=buf.numberOfChannels>1?buf.getChannelData(1):Lc;
  const dec=Math.max(1,Math.round(sr/22050)),fs=sr/dec,n=Math.floor(Lc.length/dec);
  const mid=new Float32Array(n),side=new Float32Array(n);
  for(let i=0;i<n;i++){let a=0,b=0;for(let k=0;k<dec;k++){a+=Lc[i*dec+k];b+=Rc[i*dec+k];}mid[i]=(a+b)/(2*dec);side[i]=(a-b)/(2*dec);}
  const N=512,H=256,fps=fs/H,nf=Math.max(1,Math.floor((n-N)/H));
  const cosT=new Float32Array(N/2),sinT=new Float32Array(N/2),rev=new Uint16Array(N),win=new Float32Array(N);
  for(let i=0;i<N/2;i++){cosT[i]=Math.cos(2*Math.PI*i/N);sinT[i]=Math.sin(2*Math.PI*i/N);}
  for(let i=0;i<N;i++){let r=0;for(let b=0;b<9;b++)if(i&(1<<b))r|=1<<(8-b);rev[i]=r;win[i]=.5-.5*Math.cos(2*Math.PI*i/N);}
  const re=new Float32Array(N),im=new Float32Array(N),prev=new Float32Array(N/2);
  const flux=new Float32Array(nf),en=new Float32Array(nf),low=new Float32Array(nf),va=new Float32Array(nf),cen=new Float32Array(nf);
  const hz=fs/N,k1=Math.round(300/hz),k2=Math.round(3400/hz),kl=Math.max(1,Math.round(150/hz));
  for(let f=0;f<nf;f++){const o=f*H;
    for(let i=0;i<N;i++){re[i]=mid[o+i]*win[i];im[i]=0;}
    fftMag(re,im,N,cosT,sinT,rev);
    let fl=0,e=0,lo=0,em=0,cs=0;
    for(let k=1;k<N/2;k++){const p=re[k]*re[k]+im[k]*im[k],lg=Math.log1p(50*Math.sqrt(p));
      if(lg>prev[k])fl+=lg-prev[k];prev[k]=lg;e+=p;if(k<=kl)lo+=p;if(k>=k1&&k<=k2){em+=p;cs+=p*k*hz;}}
    for(let i=0;i<N;i++){re[i]=side[o+i]*win[i];im[i]=0;}
    fftMag(re,im,N,cosT,sinT,rev);
    let es=0;for(let k=k1;k<=k2;k++)es+=re[k]*re[k]+im[k]*im[k];
    flux[f]=fl;en[f]=e;low[f]=lo;va[f]=Math.sqrt(Math.max(0,em-2*es));cen[f]=em>0?cs/em:0;}
  // tempo: autocorrelation of the onset curve, then a fine search for the exact tempo and beat phase
  const on=new Float32Array(nf);
  for(let f=0;f<nf;f++){let s=0,c=0;for(let k=-15;k<=15;k++){const j=f+k;if(j>=0&&j<nf){s+=flux[j];c++;}}on[f]=Math.max(0,flux[f]-s/c);}
  const sm=new Float32Array(nf);
  for(let f=0;f<nf;f++){let s=0;for(let k=-3;k<=3;k++){const j=f+k;if(j>=0&&j<nf)s+=on[j]*(.5+.5*Math.cos(Math.PI*k/4));}sm[f]=s;}
  const at=x=>{const i=Math.floor(x);return i<0||i>=nf-1?0:sm[i]*(1-(x-i))+sm[i+1]*(x-i);};
  let best=0,c0=120;
  for(let bpm=70;bpm<=180;bpm+=.5){const lag=60/bpm*fps,i=Math.floor(lag),w=lag-i;let a=0,b=0;
    for(let f=0;f+i+1<nf;f+=2){a+=sm[f]*sm[f+i];b+=sm[f]*sm[f+i+1];}

  let bs=-1,bpm=c0,ph=0;
  for(let q=c0*.97;q<=c0*1.03;q+=.02){const per=60/q*fps,nb=Math.floor(nf/per)-1;
    for(let j=0;j<24;j++){const p=per*j/24;let s=0;for(let b=0;b<nb;b++)s+=at(p+b*per);s/=Math.max(1,nb);
      if(s>bs){bs=s;bpm=q;ph=p/fps;}}}
  while(bpm<88)bpm*=2;while(bpm>176)bpm/=2;
  const T=60/bpm,dur=buf.duration;ph=ph%T;
  // bar and phrase start: the beat that carries the most bass
  const lowAt=t=>{const i=Math.round(t*fps);let s=0;for(let k=-1;k<=2;k++){const j=i+k;if(j>=0&&j<nf)s+=low[j];}return s;};
  let kb=0,kv=-1;
  for(let k=0;k<4;k++){let s=0;for(let t=ph+k*T;t<dur;t+=4*T)s+=lowAt(t);if(s>kv){kv=s;kb=k;}}
  let off=(ph+kb*T)%(8*T);
  // energy level of every 8-beat phrase -> calm / medium / wild moves
  const nPhr=Math.max(1,Math.ceil((dur-off)/(8*T))),pe=[],pf=[];
  for(let p=0;p<nPhr;p++){const a=Math.max(0,Math.floor((off+p*8*T)*fps)),b=Math.min(nf,Math.floor((off+(p+1)*8*T)*fps));
    let e=0,fl=0;for(let f=a;f<b;f++){e+=en[f];fl+=on[f];}const c=Math.max(1,b-a);pe.push(10*Math.log10(e/c+1e-12));pf.push(fl/c);}
  const z=a=>{const m=a.reduce((x,y)=>x+y,0)/a.length,s=Math.sqrt(a.reduce((x,y)=>x+(y-m)*(y-m),0)/a.length)||1;return a.map(v=>(v-m)/s);};
  const ze=z(pe),zf=z(pf),sc=ze.map((v,i)=>v+.7*zf[i]),sorted=sc.slice().sort((a,b)=>a-b);
  const spe=pe.slice().sort((a,b)=>a-b),range=spe[Math.floor(spe.length*.9)]-spe[Math.floor(spe.length*.1)];
  const flat=range<3,qLo=sorted[Math.floor(sorted.length*(flat?.14:.3))],qHi=sorted[Math.floor(sorted.length*(flat?.45:.62))];
  const lev=new Int8Array(nPhr);for(let p=0;p<nPhr;p++)lev[p]=sc[p]<qLo?0:sc[p]>=qHi?2:1;
  // voice: centre-panned mid band -> how far the mouth opens; brightness -> wide or round mouth
  const sv=Array.from(va).filter(v=>v>0).sort((a,b)=>a-b),fl0=sv[Math.floor(sv.length*.25)]||0,pk=(sv[Math.floor(sv.length*.92)]||1)-fl0||1;
  const voc=new Float32Array(nf),bri=new Float32Array(nf),w=Math.round(fps*.25);let run=0;
  for(let f=0;f<nf;f++){run+=va[f];if(f>=2*w)run-=va[f-2*w];const slow=run/Math.min(f+1,2*w);
    const o=Math.min(1,Math.max(0,(va[f]-fl0)/pk));
    voc[f]=Math.min(1,Math.max(0,.5*o+1.5*Math.max(0,(va[f]-slow)/pk)));
    bri[f]=Math.min(1,Math.max(0,(cen[f]-800)/1400));}
  return {buf,bpm,off,dur,fps,lev,nPhr,voc,bri};
}
let song=null,songSrc=null,songStart=0,songPos=0,songPlaying=false;
const songTime=()=>((ac.currentTime-songStart)%song.dur+song.dur)%song.dur;
function ensureAC(){
  if(ac)return;

  const comp=ac.createDynamicsCompressor();comp.connect(ac.destination);
  master=ac.createGain();master.gain.value=.6;master.connect(comp);

function rebase(){beat0=beatNow();tRef=performance.now();}
function stopSynth(){if(playing){clearInterval(timer);playing=false;}}
let wantPlay=false;
function playSong(){
  if(ac.state!=='running'){   // browsers hold sound back until the first touch; start the moment it is allowed
    try{const p=ac.resume();if(p&&p.then)p.then(()=>{if(ac.state==='running'&&song&&!songPlaying)playSong();}).catch(()=>{});}catch(e){}

}
function pauseSong(){

function kv(mode,val){return new Promise((res,rej)=>{try{const r=indexedDB.open('pepero',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onerror=()=>rej(r.error);
  r.onsuccess=()=>{try{const tx=r.result.transaction('kv',mode),st=tx.objectStore('kv'),q=mode==='readwrite'?st.put(val,'song'):st.get('song');
    q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}catch(e){rej(e);}};}catch(e){rej(e);}});}
async function loadSong(ab,remember){
  ensureAC();

  await new Promise(r=>setTimeout(r,30));

const title=document.getElementById('title');

const E0={};CHK.forEach(n=>E0[n]=0);
function frame(){

  if(H3)H3.apply(E0);

setTheme(1);
